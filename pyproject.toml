[project]
name = "classroom-ai-agent"
version = "1.0.0"
description = "Google Classroom AI Assignment Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.130.0",
    "python-dotenv>=1.0.1",
    "python-docx>=1.1.2",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.3.0",
    "requests>=2.32.0",
    "flask>=3.0.0",
]

[tool.vercel]
entrypoint = "app.web:app"