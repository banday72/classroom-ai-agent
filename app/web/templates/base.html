<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Classroom AI Assistant{% endblock %}</title>
<style>
  :root {
    --brand:#1a73e8; --bg:#f5f7fa; --card:#fff; --ink:#202124; --muted:#5f6368;
    --border:#e1e4e8; --hover:#f8f9fa; --input:#fff; --input-ink:#202124;
  }
  [data-theme="dark"] {
    --brand:#4c8dff; --bg:#121212; --card:#1e1f22; --ink:#e8eaed; --muted:#9aa0a6;
    --border:#2f3136; --hover:#25262a; --input:#121212; --input-ink:#e8eaed;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:12px 20px; display:flex; flex-wrap:wrap; align-items:center; gap:14px; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  nav { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  nav a { color:#fff; text-decoration:none; font-size:13.5px; opacity:.9; }
  nav a:hover { opacity:1; text-decoration:underline; }
  nav form { margin:0; }
  .linkbtn { background:none; border:none; color:#fff; font:inherit; cursor:pointer; opacity:.9; padding:0; text-decoration:none; }
  .linkbtn:hover { text-decoration:underline; opacity:1; }
  main { max-width:1050px; margin:20px auto; padding:0 14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:18px 20px; margin-bottom:16px; }
  .badge { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; }
  .badge.secondary{background:#e8eaed;color:#5f6368} .badge.primary{background:#d2e3fc;color:#1a56a8}
  .badge.warning{background:#fef7e0;color:#9a6700} .badge.success{background:#e6f4ea;color:#137333}
  .badge.light{background:#f1f1f1;color:#5f6368}
  [data-theme="dark"] .badge.secondary{background:#3c4043;color:#e8eaed}
  [data-theme="dark"] .badge.primary{background:#1a3a63;color:#a8c7fa}
  [data-theme="dark"] .badge.warning{background:#4a3c00;color:#fde293}
  [data-theme="dark"] .badge.success{background:#1e3a24;color:#a8dab5}
  [data-theme="dark"] .badge.light{background:#3c4043;color:#e8eaed}
  .msg { padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
  .ok { background:#e6f4ea; color:#137333; } .err { background:#fce8e6; color:#c5221f; }
  [data-theme="dark"] .msg.ok{background:#1e3a24;color:#a8dab5}
  [data-theme="dark"] .msg.err{background:#3c1f1c;color:#f28b82}
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; }
  a.btn, button.btn { display:inline-block; padding:7px 13px; border-radius:7px; font-size:13px;
        border:none; cursor:pointer; text-decoration:none; background:var(--brand); color:#fff; }
  a.btn.gray, button.gray { background:var(--border); color:var(--ink); }
  button.reg { background:#fbbc04; color:#3c4043; }
  button.danger, .danger { background:#d93025; color:#fff; }
  .muted { color:var(--muted); font-size:13px; }
  .stats { display:flex; gap:26px; flex-wrap:wrap; }
  .stat { text-align:center; }
  .stat b { display:block; font-size:26px; }
  .stat span { font-size:12px; color:var(--muted); }
  .filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:6px; }
  input, select, textarea { background:var(--input); color:var(--input-ink); border:1px solid var(--border);
        border-radius:7px; padding:8px 10px; font-size:13.5px; font-family:inherit; }
  textarea { font-family:Consolas,monospace; width:100%; min-height:320px; padding:12px; }
  .due-overdue { color:#d93025; font-weight:700; }
  .due-soon { color:#e37400; font-weight:600; }
  @media (max-width:760px) {
    header h1 { width:100%; }
    .stats { gap:16px; }
    .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table { min-width:620px; }
    .filters input, .filters select { flex:1; min-width:130px; }
  }
</style>
<script>
  (function () {
    var t = localStorage.getItem("theme");
    if (t) document.documentElement.dataset.theme = t;
  })();
  function toggleTheme() {
    var cur = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = cur;
    localStorage.setItem("theme", cur);
  }
  function jump(id) { document.getElementById(id).submit(); return false; }
</script>
</head>
<body>
<header>
  <h1>Classroom AI Assistant</h1>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/courses">Courses</a>
    <a href="/batch">Batch</a>
    <a href="/models">AI models</a>
    <form id="syncForm" method="post" action="/sync"></form>
    <button class="linkbtn" onclick="jump('syncForm')">Sync</button>
    <button class="linkbtn" onclick="toggleTheme()">&#9789; Theme</button>
    <form id="logoutForm" method="post" action="/logout"></form>
    <button class="linkbtn" onclick="jump('logoutForm')">Logout</button>
  </nav>
</header>
<main>
  {% if msg %}<div class="msg {% if 'fail' in msg|lower or 'error' in msg|lower or 'must type' in msg|lower %}err{% else %}ok{% endif %}">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
